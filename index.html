<!DOCTYPE html>
<html lang="ja">
<head>
<!-- PWA・メタデータ設定：プログレッシブウェブアプリ化、アイコン登録 -->
<link rel="manifest" href="/estimate-creation.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

  <!-- ベースURL設定：リンクを新タブで開かない -->
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Googleの Material Design アイコン読み込み -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- SweetAlert2：モーダルダイアログ・アラート用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ログイン画面：初期表示（認証前） -->
<div id="loginScreen" style="display:none;">
  <div class="login-box">
    <h2 style="text-align:center; margin-bottom:35px;">見積データ入力フォーム ログイン</h2>
    
    <form onsubmit="handleLoginSubmit(); return false;">
      
      <div style="margin-bottom:35px;">
        <label for="loginIdInput" style="display:block; margin-bottom:8px; font-weight:bold;">ログインID</label>
        <input type="text" id="loginIdInput" name="username" autocomplete="username"
          style="width:100%; padding:12px; box-sizing: border-box; border:1px solid var(--gray-border);
          border-radius: var(--radius); font-size:16px;" placeholder="IDを入力してください">
      </div>
      
      <div style="margin-bottom:35px; position:relative;">
        <label for="loginPasswordInput" style="display:block; margin-bottom:8px; font-weight:bold;">パスワード</label>
        <input type="password" id="loginPasswordInput" name="password" autocomplete="current-password"
          style="width:100%; padding:12px; box-sizing: border-box; border:1px solid var(--gray-border); padding-right:50px;
          border-radius: var(--radius); font-size:16px;" placeholder="パスワードを入力してください">
        
        <span onclick="togglePasswordVisibility()" style="position:absolute; right:12px; bottom: 0; height: 50px; display: flex; align-items: center; cursor:pointer; color:var(--text-secondary); user-select:none;">
          <span id="eyeIcon" class="material-symbols-outlined" style="font-size: 22px; vertical-align: middle;">visibility_off</span>
        </span>
      </div>
      <button id="loginBtn" type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:14px; font-weight:600;">ログイン</button>
    </form>

  </div>
</div>

<!-- メニュー画面：ログイン後の機能選択 -->
<div id="appWrapper" class="app-container" style="display:none;">

  <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:12px; border-bottom:2px solid var(--gray-border); width:100%; box-sizing:border-box;">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="material-symbols-outlined" style="font-size:24px; color:var(--primary);">list_alt_add</span>
      <h1 style="font-size:18px; font-weight:600; color:var(--primary); margin:0;"> 見積書作成フォーム</h1>
    </div>
    
    <div style="display:flex; align-items:center; gap:12px;">

      <button type="button" id="backToMenuBtn" class="mini-logout-btn" style="display:none; padding:6px 10px; font-size:12px; align-items:center; gap:4px;" onclick="handleBackToMenu()">
        <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
        メニューに戻る
      </button>

      <span id="userDisplayLabel" style="font-size:12px; color:var(--text-secondary); font-weight:bold; background:var(--gray-light); padding:6px 12px; border-radius:var(--radius);"></span>

      <button type="button" id="logoutBtn" class="mini-logout-btn" style="padding:6px 10px; font-size:12px; display:inline-flex; align-items:center;" onclick="handleLogout()">
        <span class="material-symbols-outlined" style="font-size:16px;">logout</span>
      </button>
    </div>
  </header>

  <div id="menuScreen" style="display:none; flex-direction:column; width:100%;">
    <div style="text-align:center; margin-bottom:20px;">
      <p style="font-size:14px; color:var(--text-secondary); margin:0;">以下の操作を選択してください</p>
    </div>
    <div style="display:flex; flex-direction:column; gap:32px; max-width:600px; margin:0 auto; width:100%;">
      <button type="button" class="btn btn-primary" style="width:100%; padding:20px; font-size:16px; text-align:left; display:flex; align-items:center; gap:12px;" onclick="handleMenuClick('NEW_ESTIMATE')">
        <span class="material-symbols-outlined" style="font-size:32px;">add_circle</span>
        <div>
          <div style="font-weight:bold;">新規見積書を作成</div>
          <div style="font-size:12px; opacity:0.9;">最初から新しく見積書を作成します</div>
        </div>
      </button>

      <button type="button" class="btn btn-primary" style="width:100%; padding:20px; font-size:16px; text-align:left; display:flex; align-items:center; gap:12px; background-color:#334155;" onclick="handleMenuClick('NEW_ESTIMATE_B')">
        <span class="material-symbols-outlined" style="font-size:32px;">add_box</span>
        <div>
          <div style="font-weight:bold;">新規見積書を作成（デザインB）</div>
          <div style="font-size:12px; opacity:0.9;">新しいフォーマットで見積書を作成します</div>
        </div>
      </button>
 
      <button type="button" class="btn btn-primary" style="width:100%; padding:20px; font-size:16px; text-align:left; display:flex; align-items:center; gap:12px; background-color:var(--primary-light);" onclick="handleMenuClick('PAST_ESTIMATE')">
        <span class="material-symbols-outlined" style="font-size:32px;">content_copy</span>
        <div>
          <div style="font-weight:bold;">過去の見積書から作成</div>
          <div style="font-size:12px; opacity:0.9;">保存済みの見積書をコピーして作成</div>
        </div>
      </button>
 
      <button type="button" class="btn btn-primary" style="width:100%; padding:20px; font-size:16px; text-align:left; display:flex; align-items:center; gap:12px; background-color:var(--success);" onclick="handleMenuClick('VIEW_ESTIMATE')">
        <span class="material-symbols-outlined" style="font-size:32px;">visibility</span>
        <div>
          <div style="font-weight:bold;">見積書を確認</div>
          <div style="font-size:12px; opacity:0.9;">保存済みの見積書PDFを表示します </div>
        </div>
      </button>
 
      <button type="button" class="btn btn-primary" style="width:100%; padding:20px; font-size:16px; text-align:left; display:flex; align-items:center; gap:12px; background-color:var(--warning);" onclick="handleMenuClick('EDIT_DRAFT')">
        <span class="material-symbols-outlined" style="font-size:32px;">edit</span>
        <div>
          <div style="font-weight:bold;">下書きを編集</div>
          <div style="font-size:12px; opacity:0.9;">下書き保存中の見積内容を編集します</div>
        </div>
      </button>
    </div>
  </div>

  <div id="mainApp" style="display:none; width:100%;">
    <form id="estimateForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="estimateDate">見積作成日 <span class="badge-required">必須</span></label>
          <input type="date" id="estimateDate" required>
        </div>
        <div class="form-group">
          <label for="clientSelect">取引先 <span class="badge-required">必須</span></label>
          <select id="clientSelect" required onchange="toggleNewClient()">
            <option value="">-- 選択（読込中...） --</option>
          </select>
          <div id="newClientContainer" class="dynamic-input-container" style="display: none;">
            <label for="clientName">新規取引先名 *</label>
            <input type="text" id="clientName" placeholder="○○○○株式会社">
          </div>
        </div>
       
        <div class="form-group">
          <label for="contactPersonSelect">取引先担当者</label>
          <select id="contactPersonSelect" onchange="toggleNewContactPerson()">
            <option value="">-- 取引先を先に選択してください --</option>
          </select>
          <div id="newContactPersonContainer" class="dynamic-input-container" style="display: none;">
            <label for="contactPersonName">新規担当者名 *</label>
            <input type="text" id="contactPersonName" placeholder="山田太郎">
          </div>
        </div>
        
        <div class="form-group full-width">
          <label for="clientAddress">現場 住所</label>
          <div class="voice-input-wrapper">
            <input type="text" id="clientAddress" placeholder="〒000-0000 住所">
            <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
              <span class="material-symbols-outlined">mic</span>
            </button>
          </div>
        </div>
       
        <div class="form-group full-width">
          <label for="subject">件名 <span class="badge-required">必須</span></label>
          <div class="voice-input-wrapper">
            <input type="text" id="subject" required placeholder="例) 工事に伴うお見積り">
            <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
              <span class="material-symbols-outlined">mic</span>
            </button>
          </div>
        </div>
       
        <div class="form-group">
          <label for="validity">有効期限</label>
          <input type="text" id="validity" value=" 御見積作成から1ヵ月">
        </div>
       
        <div class="form-group">
          <label for="paymentTerms">支払条件</label>
          <input type="text" id="paymentTerms" value=" 従来通り">
        </div>
      </div>

      <div class="table-section-header">
        <label>【明細項目】</label>
      </div>
      
      <div id="detailsContainer" class="details-list"></div>

      <div class="table-section-header">
        <button type="button" class="btn btn-secondary" onclick="addTableRow()">
          <span class="material-symbols-outlined">add_circle</span>項目追加
        </button>
      </div>

      <div class="footer-flex">
        <div class="bottom-remarks form-group">
          <label for="remarks">全体備考・特記事項</label>
          <div class="voice-input-wrapper">
            <textarea id="remarks" rows="4" placeholder="見積書の備考欄に記載する内容"></textarea>
            <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
              <span class="material-symbols-outlined">mic</span>
            </button>
          </div>
        </div>
        
        <div class="summary-box">
          <div class="summary-row">
            <span>小計 (税抜)</span>
            <span>¥<span id="subtotalLabel">0</span></span>
          </div>
          <div class="summary-row">
            <span>消費税 (10%)</span>
            <span>¥<span id="taxLabel">0</span></span>
          </div>
          <div class="summary-row total">
            <span>合計金額 (税込)</span>
            <span>¥<span id="totalLabel">0</span></span>
          </div>
          
          <div style="display: flex; gap: 8px; width: 100%;">
            <button type="button" class="btn btn-primary" style="background-color: var(--gray-light); color: var(--text-primary); border: 1px solid var(--gray-border); flex: 1;" onclick="showPDFPreview()">
              <span class="material-symbols-outlined">visibility</span>プレビュー
            </button>
            <button type="button" class="btn btn-primary" style="background-color: var(--warning); flex: 1;" onclick="executeSaveProcess('saveDraft')">
              <span class="material-symbols-outlined">draft</span>下書き保存
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- =====================================
       デザインB（新フォーマット）入力フォーム
       ===================================== -->
  <div id="mainAppB" class="design-b-scope" style="display:none; width:100%;">
    <div class="container">
      <!-- 1. 基本情報入力エリア -->
      <div class="info-card">
        <h2>基本情報</h2>
        <div class="info-grid">
          <div class="info-field">
            <label>見積日</label>
            <input type="date" id="infoDate">
          </div>
          <div class="info-field">
            <label>見積担当</label>
            <input type="text" id="infoEstimator" placeholder="担当者名">
          </div>
          <div class="info-field">
            <label>取引先</label>
            <input type="text" id="infoClient" placeholder="取引先会社名">
          </div>
          <div class="info-field">
            <label>担当</label>
            <input type="text" id="infoClientContact" placeholder="先方担当者名">
          </div>
          <div class="info-field full-width">
            <label>件名</label>
            <input type="text" id="infoSubject" placeholder="例: ○○マンション101号室 原状回復工事">
          </div>
          <div class="info-field">
            <label>部番号</label>
            <input type="text" id="infoDeptNo" placeholder="部屋番号/部番号">
          </div>
          <div class="info-field">
            <label>間取り</label>
            <input type="text" id="infoLayout" placeholder="例: 1LDK / 30㎡">
          </div>
        </div>
      </div>

      <!-- 2. カテゴリ入力エリア (JS動的生成) -->
      <div id="categoryContainer"></div>

      <!-- 3. 全体備考エリア -->
      <div class="global-remark-card">
        <h2>全体備考</h2>
        <textarea class="global-remark-textarea" id="globalRemark" placeholder="見積書全体に関する特記事項や備考を入力してください..."></textarea>
      </div>

      <!-- 3.5 共通アクション（プレビュー／下書き保存） -->
      <div style="display:flex; gap:8px; margin-bottom:16px;">
        <button type="button" class="btn btn-primary" style="background-color: var(--gray-light); color: var(--text-primary); border: 1px solid var(--gray-border); flex: 1;" onclick="showPDFPreview()">
          <span class="material-symbols-outlined">visibility</span>プレビュー
        </button>
        <button type="button" class="btn btn-primary" style="background-color: var(--warning); flex: 1;" onclick="executeSaveProcess('saveDraft')">
          <span class="material-symbols-outlined">draft</span>下書き保存
        </button>
      </div>
    </div>

    <!-- 4. 固定ボトムバー -->
    <div class="bottom-bar">
      <div class="breakdown-grid">
        <div class="breakdown-item">
          <span class="label">基本クリーニング</span>
          <span class="value" id="summaryCleaning">¥0</span>
        </div>
        <div class="breakdown-item">
          <span class="label">エアコン</span>
          <span class="value" id="summaryAircon">¥0</span>
        </div>
        <div class="breakdown-item">
          <span class="label">補修</span>
          <span class="value" id="summaryRepair">¥0</span>
        </div>
        <div class="breakdown-item">
          <span class="label">消費税</span>
          <span class="value" id="summaryTax">¥0</span>
        </div>
      </div>
      <div class="grand-total-wrap">
        <div class="grand-total-label">税込金額</div>
        <div class="grand-total-amount" id="grandTotalTax">¥0</div>
      </div>
    </div>
  </div>
</div>

<div id="listModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:9998; justify-content:center; align-items:center; padding:12px; box-sizing:border-box;">
  <div style="background:white; width:100%; max-width:800px; height:85vh; border-radius:var(--radius); padding:20px; box-sizing:border-box; display:flex; flex-direction:column; gap:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--gray-border); padding-bottom:10px;">
      <h3 id="listModalTitle" style="color:var(--primary); font-size:18px;">データを選択</h3>
      <button type="button" class="mini-logout-btn" onclick="document.getElementById('listModal').style.display='none';">✕ 閉じる</button>
    </div>
 
    <div id="modalListContainer" style="flex:1; overflow-y:auto; border:1px solid var(--gray-border); border-radius:var(--radius); padding:8px; background:#f8fafc;">
      </div>
  </div>
</div>
  
<div id="loader">
  <div class="spinner"></div>
  <div id="loaderText">データを保存＆PDFを作成中...</div>
</div>

  <script src="./01_config.js"></script>
  <script src="./02_auth.js"></script>
  <script src="./03_navigation.js"></script>
  <script src="./04_listModal.js"></script>
  <script src="./05_masterData.js"></script>
  <script src="./06_utils.js"></script>
  <script src="./07_designA-form.js"></script>
  <script src="./08_previewSave.js"></script>
  <script src="./09_designB-form.js"></script>
  
</body>
</html>
