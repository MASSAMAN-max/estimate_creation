<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>見積入力システム</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.5;
    }
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--panel);
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    header {
      margin-bottom: 20px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 20px; color: var(--primary); font-weight: bold; }
    .estimate-no-disp { font-size: 14px; background: #e2e8f0; padding: 4px 12px; border-radius: 4px; font-weight: bold; }
    
    /* 入力フォームのグリッド配置（入力しやすさ重視） */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1max));
      gap: 16px;
      margin-bottom: 24px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    label { font-size: 13px; font-weight: bold; color: #475569; }
    label .required { color: #ef4444; margin-left: 4px; }
    
    input[type="text"], input[type="date"], input[type="number"], textarea {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      background: #fff;
    }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    
    /* 明細テーブル（幅を十分に広げ、入力しやすく） */
    .table-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .table-container { width: 100%; overflow-x: auto; margin-bottom: 20px; border: 1px solid var(--border); border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; background: #fff; table-layout: fixed; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px; vertical-align: middle; }
    th { background: #f1f5f9; font-size: 13px; font-weight: bold; text-align: left; color: #475569; }
    
    /* 列幅の最適化 */
    .w-del      { width: 70px; text-align: center; }
    .w-category { width: 150px; }
    .w-name     { width: 280px; }
    .w-qty      { width: 90px; }
    .w-unit     { width: 70px; }
    .w-price    { width: 120px; }
    .w-amount   { width: 130px; text-align: right; }
    .w-remarks  { width: 150px; }
    
    th.w-del, th.w-amount { text-align: center; }
    td.w-amount { font-weight: bold; text-align: right; font-size: 14px; background: #f8fafc; padding-right: 12px; }
    
    td input { padding: 6px 8px !important; font-size: 13px !important; }
    
    /* 下部計算エリアとボタン */
    .footer-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      margin-top: 20px;
    }
    .bottom-remarks { flex: 1; }
    .summary-box {
      width: 320px;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .summary-row { display: flex; justify-content: space-between; font-size: 14px; }
    .summary-row.total { font-weight: bold; font-size: 16px; color: var(--primary); border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 4px; }
    
    /* ボタン類 */
    .btn {
      padding: 8px 16px; font-size: 14px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 14px; font-size: 16px; margin-top: 16px; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; color: #fff; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #ef4444; color: #fff; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background: #dc2626; }
    
    /* ローダー */
    #loader {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8);
      display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-weight: bold; z-content: 9999;
    }
    .spinner { width: 40px; height: 40px; border: 4px solid #cbd5e1; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>見積データ入力フォーム</h1>
      <div class="estimate-no-disp">見積No: <span id="numberPlaceholder">自動採番</span></div>
    </header>

    <form id="estimateForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="clientName">発注元（宛名）<span class="required">*</span></label>
          <input type="text" id="clientName" required placeholder="○○○○株式会社">
        </div>
        <div class="form-group">
          <label for="estimateDate">見積作成日<span class="required">*</span></label>
          <input type="date" id="estimateDate" required>
        </div>
        <div class="form-group full-width">
          <label for="subject">件名 *</label>
          <input type="text" id="subject" required placeholder="例) 新築工事に伴うお見積り">
        </div>
        <div class="form-group">
          <label for="validity">有効期限</label>
          <input type="text" id="validity" value="御見積作成から3ヵ月">
        </div>
        <div class="form-group">
          <label for="paymentTerms">支払条件</label>
          <input type="text" id="paymentTerms" value="月末締め翌月末払い">
        </div>
      </div>

      <div class="table-section-header">
        <label style="font-size: 15px; color: var(--primary);">【明細項目】</label>
        <button type="button" class="btn btn-secondary" onclick="addTableRow()">＋ 行を追加</button>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="w-del">操作</th>
              <th class="w-category">項目（大分類）</th>
              <th class="w-name">仕様・摘要（品名等）</th>
              <th class="w-qty">数量</th>
              <th class="w-unit">単位</th>
              <th class="w-price">単価</th>
              <th class="w-amount">金額（自動）</th>
              <th class="w-remarks">備考</th>
            </tr>
          </thead>
          <tbody id="detailsTableBody"></tbody>
        </table>
      </div>

      <div class="footer-flex">
        <div class="bottom-remarks form-group">
          <label for="remarks">全体備考・特記事項</label>
          <textarea id="remarks" rows="5" placeholder="見積書の下部に記載する全体の備考項目があれば入力"></textarea>
        </div>
        
        <div class="summary-box">
          <div class="summary-row">
            <span>小計 (税抜):</span>
            <span>¥<span id="subtotalLabel">0</span></span>
          </div>
          <div class="summary-row">
            <span>消費税 (10%):</span>
            <span>¥<span id="taxLabel">0</span></span>
          </div>
          <div class="summary-row total">
            <span>合計金額 (税込):</span>
            <span>¥<span id="totalLabel">0</span></span>
          </div>
          
          <button type="submit" class="btn btn-primary">💾 この内容でGASへ保存 ＆ PDF生成</button>
        </div>
      </div>
    </form>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <div>データを保存＆PDFを自動作成中...</div>
  </div>

  <script>
    // 💡 ご自身のGASの「ウェブアプリURL」
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQkNvNQblWXRtenGPoSaXbi99ftJ61j02s11rzCxwQZ4bDGddhzuDwrCRu0wYQxbNAow/exec"; 

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('estimateDate').value = new Date().toISOString().split('T')[0];
      for(let i=0; i<3; i++) addTableRow(); // 初期行を3行作成
    });

    // 明細行の追加
    function addTableRow() {
      const tbody = document.getElementById('detailsTableBody');
      const tr = document.createElement('tr');
      
      tr.innerHTML = `
        <td class="w-del">
          <button type="button" class="btn btn-danger" onclick="deleteTableRow(this)">削除</button>
        </td>
        <td class="w-category">
          <input type="text" class="item-category" placeholder="例) クリーニング">
        </td>
        <td class="w-name">
          <input type="text" class="item-name" placeholder="例) サッシ（大）">
        </td>
        <td class="w-qty">
          <input type="number" class="item-qty" style="text-align: right;" min="0" step="any" value="0" oninput="calculateAmount(this)">
        </td>
        <td class="w-unit">
          <input type="text" class="item-unit" style="text-align: center;" placeholder="式">
        </td>
        <td class="w-price">
          <input type="number" class="item-price" style="text-align: right;" min="0" value="0" oninput="calculateAmount(this)">
        </td>
        <td class="w-amount">
          ¥<span class="item-amount">0</span>
        </td>
        <td class="w-remarks">
          <input type="text" class="item-remarks" placeholder="">
        </td>
      `;
      tbody.appendChild(tr);
    }

    function deleteTableRow(button) {
      button.closest('tr').remove();
      updateTotalSummary();
    }

    function calculateAmount(input) {
      const row = input.closest('tr');
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;
      
      const amount = Math.floor(qty * price); 
      row.querySelector('.item-amount').textContent = amount.toLocaleString();
      row.querySelector('.item-amount').dataset.value = amount; 
      
      updateTotalSummary();
    }

    function updateTotalSummary() {
      let subtotal = 0;
      document.querySelectorAll('.item-amount').forEach(span => {
        subtotal += parseFloat(span.dataset.value) || 0;
      });
      
      const tax = Math.floor(subtotal * 0.1);
      const total = subtotal + tax;
      
      document.getElementById('subtotalLabel').textContent = subtotal.toLocaleString();
      document.getElementById('taxLabel').textContent = tax.toLocaleString();
      document.getElementById('totalLabel').textContent = total.toLocaleString();
      document.getElementById('totalLabel').dataset.value = total;
    }

    // フォーム送信処理
    document.getElementById('estimateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const details = [];
      document.querySelectorAll('#detailsTableBody tr').forEach(row => {
        const name = row.querySelector('.item-name').value.trim();
        const category = row.querySelector('.item-category').value.trim();
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const unit = row.querySelector('.item-unit').value.trim() || '式';
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const remarks = row.querySelector('.item-remarks').value.trim();
        
        if(name !== "" || category !== "") {
          details.push({
            itemCategory: category,
            itemName: name,
            itemQty: qty,
            itemUnit: unit,
            itemPrice: price,
            itemAmount: Math.floor(qty * price),
            itemRemarks: remarks
          });
        }
      });

      if(details.length === 0) {
        alert("明細を1件以上入力してください。");
        return;
      }

      // ⭕️ 前回の不具合を修正した「.value」によるデータ取得
      const payload = {
        clientName: document.getElementById('clientName').value.trim(),
        estimateDate: document.getElementById('estimateDate').value,
        subject: document.getElementById('subject').value.trim(),
        paymentTerms: document.getElementById('paymentTerms').value.trim(),
        validity: document.getElementById('validity').value.trim(),
        remarks: document.getElementById('remarks').value.trim(),
        totalAmount: parseInt(document.getElementById('totalLabel').dataset.value) || 0,
        details: details
      };

      document.getElementById('loader').style.display = 'flex';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
          alert(`見積データを保存し、PDFを自動生成しました！\n見積番号: ${result.estimateNo}`);
          document.getElementById('numberPlaceholder').textContent = result.estimateNo;
        } else {
          alert('エラーが発生しました: ' + result.message);
        }
      } catch (error) {
        alert('通信エラー: ' + error.message);
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    });
  </script>
</body>
</html>
