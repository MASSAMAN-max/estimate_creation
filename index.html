<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易見積書作成システム</title>
  <style>
    :root {
      --primary: #1e3a8a;       /* 信頼感のあるディープブルー */
      --primary-hover: #1e40af;
      --bg: #f1f5f9;
      --text: #1e293b;
      --border: #94a3b8;        /* 少しハッキリめのボーダー */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 50px;
      border-radius: 4px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    /* 上部レイアウト（タイトル、日付、No） */
    .invoice-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .invoice-title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--text);
      border-bottom: 3px double var(--text);
      padding-bottom: 4px;
    }
    .invoice-meta {
      text-align: right;
      font-size: 14px;
    }
    .invoice-meta input[type="date"] {
      padding: 3px 8px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .placeholder-no {
      font-weight: bold;
      color: #64748b;
    }

    /* ヘッダーレイアウト（左右分割構造） */
    .invoice-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      gap: 40px;
    }
    .invoice-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .invoice-right {
      width: 300px;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
    }
    
    /* 自社情報デザイン */
    .company-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .company-ceo {
      font-size: 14px;
      margin-bottom: 8px;
    }

    /* 入力欄の基本デザイン */
    input[type="text"], input[type="number"], textarea {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      width: 100%;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      background-color: #f8fafc;
    }

    /* 宛名・件名のカスタム入力 */
    .client-input {
      font-size: 20px;
      font-weight: bold;
      border-top: none !important;
      border-left: none !important;
      border-right: none !important;
      border-radius: 0 !important;
      padding-left: 0;
    }
    .subject-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: bold;
      border-bottom: 1px solid var(--text);
      padding-bottom: 4px;
    }
    .subject-box input {
      border: none;
      font-size: 16px;
      font-weight: bold;
      padding: 2px 0;
    }

    /* 💡 PDFを模した大判の御見積金額表示エリア */
    .total-display-box {
      font-size: 20px;
      font-weight: bold;
      border-bottom: 2px solid var(--text);
      padding-bottom: 8px;
      margin-bottom: 30px;
      display: flex;
      align-items: dashed bottom;
    }
    .total-display-value {
      font-size: 28px;
      margin: 0 10px;
      border-bottom: 1px solid var(--text);
      padding: 0 20px;
      letter-spacing: 1px;
    }
    .tax-note {
      font-size: 14px;
      color: #475569;
      font-weight: normal;
      align-self: flex-end;
      margin-bottom: 4px;
    }

    /* 明細テーブル（PDFの7列構造へ拡張） */
    .table-container {
      margin-bottom: 20px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }
    th {
      background-color: #f8fafc;
      text-align: center;
    }
    .col-action { width: 55px; text-align: center; }
    .col-category { width: 120px; } /* 項目 */
    .col-qty { width: 70px; }        /* 数量 */
    .col-unit { width: 60px; }       /* 単位 */
    .col-price { width: 100px; }     /* 単価 */
    .col-amount { width: 125px; text-align: right; font-weight: bold; background-color: #f8fafc; } /* 金額 */

    .btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #475569; color: white; margin-bottom: 12px; }
    .btn-secondary:hover { background-color: #334155; }
    .btn-danger { background-color: #ef4444; color: white; padding: 3px 6px; font-size: 11px; }

    /* 下部レイアウト（有効期限・支払条件・備考） */
    .invoice-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 20px;
      border-top: 1px solid #cbd5e1;
      padding-top: 20px;
    }
    .condition-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .condition-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .condition-row label {
      width: 80px;
      font-size: 13px;
      font-weight: bold;
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 4px;
      text-align: center;
    }
    .condition-row input {
      flex: 1;
    }
    
    /* 計算確認エリア（右下） */
    .summary-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      font-size: 14px;
    }
    .summary-row {
      display: flex;
      width: 220px;
      justify-content: space-between;
    }
    .summary-row.total {
      font-size: 16px;
      font-weight: bold;
      border-top: 1px solid var(--text);
      padding-top: 4px;
    }

    /* ローダー */
    .loader-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader" class="loader-overlay" style="display: none;">
    <div class="loader"></div>
  </div>

  <div class="container">
    <form id="estimateForm">
      
      <div class="invoice-top-bar">
        <div class="invoice-title">御見積書</div>
        <div class="invoice-meta">
          <div>作成日: <input type="date" id="estimateDate" required></div>
          <div style="margin-top: 4px;">見積No. <span class="placeholder-no" id="numberPlaceholder">保存時に自動採番</span></div>
        </div>
      </div>
      
      <div class="invoice-header">
        <div class="invoice-left">
          <div style="margin-top: 10px;">
            <input type="text" id="clientName" class="client-input" required placeholder="○○○○株式会社 御中">
          </div>
          <div class="subject-box">
            <span>件名:</span>
            <input type="text" id="subject" required placeholder="新築工事に伴うお見積り">
          </div>
          <div>下記の通り、お見積り申し上げます。</div>
        </div>
        
        <div class="invoice-right">
          <div class="company-name">あたご株式会社</div>
          <div class="company-ceo">代表取締役 愛宕彰</div>
          <div>〒937-0061</div>
          <div>富山県魚津市仏田3461-2</div>
          <div>TEL: 0765-22-9883</div>
          <div>FAX: 0765-22-9009</div>
        </div>
      </div>

      <div class="total-display-box">
        <span>御見積金額</span>
        <span class="total-display-value">¥<span id="mainAmountLabel">0</span>-</span>
        <span class="tax-note">御見積金額別途消費税</span>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: flex-end;">
        <h3 style="font-size: 15px; margin-bottom: 6px;">【見積明細】</h3>
        <button type="button" class="btn btn-secondary" onclick="addTableRow()">＋ 行を追加</button>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="col-action">削除</th>
              <th class="col-category">項目</th>
              <th>仕様・摘要</th>
              <th class="col-qty">数量</th>
              <th class="col-unit">単位</th>
              <th class="col-price">単価</th>
              <th class="col-amount">金額</th>
              <th>備考</th>
            </tr>
          </thead>
          <tbody id="detailsTableBody">
            </tbody>
        </table>
      </div>

      <div class="invoice-bottom-grid">
        <div class="condition-group">
          <div class="condition-row">
            <label>有効期限</label>
            <input type="text" id="validity" value="御見積作成から3ヵ月">
          </div>
          <div class="condition-row">
            <label>支払条件</label>
            <input type="text" id="paymentTerms" value="月末締め翌月末払い">
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 6px;">
            <span style="font-size: 13px; font-weight: bold;">備考</span>
            <textarea id="remarks" rows="3" placeholder="備考項目があれば入力"></textarea>
          </div>
        </div>
        
        <div class="summary-box">
          <div class="summary-row">
            <span>小計 (税抜):</span>
            <span>¥<span id="subtotalLabel">0</span></span>
          </div>
          <div class="summary-row">
            <span>消費税 (10%):</span>
            <span>¥<span id="taxLabel">0</span></span>
          </div>
          <div class="summary-row total">
            <span>合計金額 (税込):</span>
            <span>¥<span id="totalLabel">0</span></span>
          </div>
          
          <div style="margin-top: 30px; width: 100%;">
            <button type="submit" class="btn btn-primary" style="font-size: 15px; width: 100%; padding: 12px 0;">この内容でGASへ保存</button>
          </div>
        </div>
      </div>

    </form>
  </div>

  <script>
    // 💡 前回発行されたGASの「ウェブアプリURL」をここに貼り付けてください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwN5Wbte0Iz7yq5iQMXiW0LqLBQnfd5sO4vguHxQQEhrow7u8ySJbO-7_TvBNSEnjjf-Q/exec"; 

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('estimateDate').value = new Date().toISOString().split('T')[0];
      for(let i=0; i<3; i++) addTableRow();
    });

    // 明細行の追加 (PDFの全列に対応するinputクラスを付与)
    function addTableRow() {
      const tbody = document.getElementById('detailsTableBody');
      const tr = document.createElement('tr');
      
      tr.innerHTML = `
        <td class="col-action">
          <button type="button" class="btn btn-danger" onclick="deleteTableRow(this)">削除</button>
        </td>
        <td>
          <input type="text" class="item-category" placeholder="例) 材料費">
        </td>
        <td>
          <input type="text" class="item-name" required placeholder="例) ○○サーバー構築一式">
        </td>
        <td>
          <input type="number" class="item-qty" style="text-align: right;" min="0" step="any" value="0" oninput="calculateAmount(this)">
        </td>
        <td>
          <input type="text" class="item-unit" style="text-align: center;" placeholder="式">
        </td>
        <td>
          <input type="number" class="item-price" style="text-align: right;" min="0" value="0" oninput="calculateAmount(this)">
        </td>
        <td class="col-amount">
          ¥<span class="item-amount">0</span>
        </td>
        <td>
          <input type="text" class="item-remarks" placeholder="">
        </td>
      `;
      tbody.appendChild(tr);
    }

    function deleteTableRow(button) {
      button.closest('tr').remove();
      updateTotalSummary();
    }

    function calculateAmount(input) {
      const row = input.closest('tr');
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;
      
      const amount = Math.floor(qty * price); 
      row.querySelector('.item-amount').textContent = amount.toLocaleString();
      row.querySelector('.item-amount').dataset.value = amount; 
      
      updateTotalSummary();
    }

    function updateTotalSummary() {
      let subtotal = 0;
      document.querySelectorAll('.item-amount').forEach(span => {
        subtotal += parseFloat(span.dataset.value) || 0;
      });
      
      const tax = Math.floor(subtotal * 0.1);
      const total = subtotal + tax;
      
      // PDFの「別途消費税」に合わせ、メインの巨大文字には【税抜小計】を連動
      document.getElementById('mainAmountLabel').textContent = subtotal.toLocaleString();
      
      // 右下の計算確認用
      document.getElementById('subtotalLabel').textContent = subtotal.toLocaleString();
      document.getElementById('taxLabel').textContent = tax.toLocaleString();
      document.getElementById('totalLabel').textContent = total.toLocaleString();
      document.getElementById('totalLabel').dataset.value = total; // 税込
    }

    // フォーム送信
    document.getElementById('estimateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if(GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL") {
        alert("GASのURLを差し替えてから送信してください。");
        return;
      }
      
      const details = [];
      document.querySelectorAll('#detailsTableBody tr').forEach(row => {
        const name = row.querySelector('.item-name').value.trim();
        const category = row.querySelector('.item-category').value.trim();
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const unit = row.querySelector('.item-unit').value.trim() || '式';
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const remarks = row.querySelector('.item-remarks').value.trim();
        
        if(name !== "" || category !== "") {
          details.push({
            itemCategory: category,  // 💡 追加：項目
            itemName: name,          // 仕様・摘要
            itemQty: qty,            // 数量
            itemUnit: unit,          // 単位
            itemPrice: price,        // 単価
            itemAmount: Math.floor(qty * price), // 金額
            itemRemarks: remarks     // 💡 追加：備考
          });
        }
      });

      if(details.length === 0) {
        alert("明細を1件以上入力してください。");
        return;
      }

      const payload = {
        clientName: document.getElementById('clientName').value.trim(),
        estimateDate: document.getElementById('estimateDate').value,
        subject: document.getElementById('subject').value.trim(),
        paymentTerms: document.getElementById('paymentTerms').value.trim(),
        validity: document.getElementById('validity').value.trim(),
        remarks: document.getElementById('remarks').value.trim(),
        totalAmount: parseInt(document.getElementById('totalLabel').dataset.value) || 0,
        details: details
      };

      document.getElementById('loader').style.display = 'flex';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
          alert(`見積書を保存しました！\n見積番号: ${result.estimateNo}`);
          document.getElementById('estimateForm').reset();
          document.getElementById('detailsTableBody').innerHTML = '';
          for(let i=0; i<3; i++) addTableRow();
          updateTotalSummary();
        } else {
          alert('GAS側エラー: ' + result.message);
        }
      } catch (error) {
        alert('通信エラー: ' + error.message);
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    });
  </script>
</body>
</html>
