<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見積データ入力フォーム</title>
  
  <!-- Googleの Material Design アイコン読み込み -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- SweetAlert2：モーダルダイアログ・アラート用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1976D2;
      --primary-light: #42A5F5;
      --primary-dark: #1565C0;
      --success: #4CAF50;
      --danger: #F44336;
      --warning: #FF9800;
      --gray-light: #F5F5F5;
      --gray-border: #E0E0E0;
      --text-primary: #212121;
      --text-secondary: #666666;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background-color: #FAFAFA;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      vertical-align: middle;
    }

    .app-container {
      max-width: 100%;
      margin: 0 auto;
      padding: 12px;
      background: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--gray-border);
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--primary);
    }

    .estimate-no-disp {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--gray-light);
      padding: 6px 12px;
      border-radius: var(--radius);
    }

    .estimate-no-disp span {
      font-weight: 600;
      color: var(--primary);
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (min-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      font-family: inherit;
      background: white;
      transition: border-color 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1);
    }

    .dynamic-input-container {
      margin-top: 8px;
    }

    .dynamic-input-container input {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--warning);
      background: #FFF3E0;
    }

    .table-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 12px 0;
      gap: 8px;
    }

    .table-section-header label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    .details-list {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }

    .detail-card {
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      padding: 12px;
      background: #FAFAFA;
    }

    .card-row-upper {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    @media (min-width: 768px) {
      .card-row-upper {
        grid-template-columns: 1fr 2fr 80px;
        align-items: flex-end;
      }
    }

    .card-row-lower {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (min-width: 768px) {
      .card-row-lower {
        grid-template-columns: 1fr 1fr 1fr 1.2fr 1.5fr;
      }
    }

    .field-delete {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .form-group input[type="number"] {
      text-align: right;
    }

    .form-group select {
      cursor: pointer;
    }

    .amount-display-box {
      padding: 8px 10px;
      background: white;
      border: 1px solid var(--gray-border);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      text-align: right;
    }

    .btn {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.3s;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
    }

    .btn-secondary {
      background-color: var(--gray-light);
      color: var(--primary);
      border: 1px solid var(--gray-border);
      font-size: 12px;
      padding: 6px 10px;
    }

    .btn-secondary:hover {
      background-color: #EEEEEE;
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
      font-size: 12px;
      padding: 6px 10px;
    }

    .btn-danger:hover {
      background-color: #E53935;
    }

    .btn-sm {
      background-color: var(--success);
      color: white;
      font-size: 12px;
      padding: 6px 10px;
      min-width: fit-content;
    }

    .btn-sm:hover {
      background-color: #45a049;
    }

    .btn-sm:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
     
    .btn-sm.recording {
      background-color: #F44336;
      animation: pulse 1.5s infinite;
    }
     
    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(244, 67, 54, 0);
      }
    }

    .voice-input-wrapper {
      display: flex;
      gap: 6px;
    }

    .voice-input-wrapper input {
      flex: 1;
    }

    /* マイク点滅アニメーション */
    @keyframes blink {
      0%, 49%, 100% {
        opacity: 1;
      }
      50%, 99% {
        opacity: 0.3;
      }
    }

    .footer-flex {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 768px) {
      .footer-flex {
        grid-template-columns: 2fr 1fr;
      }
    }

    .bottom-remarks {
      grid-column: 1 / -1;
    }

    .summary-box {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      color: white;
      padding: 12px;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }

    .summary-row.total {
      font-weight: 600;
      font-size: 14px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
    }

    #loader {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loaderText {
      color: white;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .app-container {
        padding: 8px;
      }

      header h1 {
        font-size: 16px;
      }

      .form-group label {
        font-size: 11px;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        font-size: 13px;
        padding: 6px 8px;
      }

      .btn {
        font-size: 12px;
        padding: 6px 10px;
      }

      .btn-primary {
        font-size: 13px;
        padding: 10px;
      }

      .detail-card {
        padding: 10px;
      }

      .summary-row {
        font-size: 12px;
      }

      .summary-row.total {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>📋 見積フォーム</h1>
      <div class="estimate-no-disp">
        見積No: <span id="numberPlaceholder">自動採番</span>
      </div>
    </header>

    <form id="estimateForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="clientSelect">取引先 *</label>
          <select id="clientSelect" required onchange="toggleNewClient()">
            <option value="">-- 選択（読込中...） --</option>
          </select>
          <div id="newClientContainer" class="dynamic-input-container" style="display: none;">
            <label for="clientName">新規取引先名 *</label>
            <input type="text" id="clientName" placeholder="○○○○株式会社 御中">
          </div>
        </div>
        
        <div class="form-group">
          <label for="estimateDate">見積作成日 *</label>
          <input type="date" id="estimateDate" required>
        </div>

        <div class="form-group full-width">
          <label for="clientAddress">取引先 住所</label>
          <input type="text" id="clientAddress" placeholder="〒000-0000 住所">
        </div>

        <div class="form-group full-width">
          <label for="subject">件名 *</label>
          <input type="text" id="subject" required placeholder="例) 工事に伴うお見積り">
        </div>

        <div class="form-group">
          <label for="validity">有効期限</label>
          <input type="text" id="validity" value="御見積作成から3ヵ月">
        </div>

        <div class="form-group">
          <label for="paymentTerms">支払条件</label>
          <input type="text" id="paymentTerms" value="月末締め翌月末払い">
        </div>
      </div>

      <div class="table-section-header">
        <label>【明細項目】</label>
        <button type="button" class="btn btn-secondary" onclick="addTableRow()">
          <span class="material-symbols-outlined">add_circle</span>行追加
        </button>
      </div>
      
      <div id="detailsContainer" class="details-list"></div>

      <div class="footer-flex">
        <div class="bottom-remarks form-group">
          <label for="remarks">全体備考・特記事項</label>
          <textarea id="remarks" rows="4" placeholder="見積書の備考欄に記載する内容"></textarea>
        </div>
        
        <div class="summary-box">
          <div class="summary-row">
            <span>小計 (税抜)</span>
            <span>¥<span id="subtotalLabel">0</span></span>
          </div>
          <div class="summary-row">
            <span>消費税 (10%)</span>
            <span>¥<span id="taxLabel">0</span></span>
          </div>
          <div class="summary-row total">
            <span>合計金額 (税込)</span>
            <span>¥<span id="totalLabel">0</span></span>
          </div>
          
          <div style="display: flex; gap: 8px; width: 100%;">
            <button type="button" class="btn btn-primary" style="flex: 1; background-color: var(--gray-light); color: var(--text-primary); border: 1px solid var(--gray-border);" onclick="showPDFPreview()">
              <span class="material-symbols-outlined">visibility</span>プレビュー
            </button>
            <button type="submit" class="btn btn-primary" style="flex: 1;">
              <span class="material-symbols-outlined">save</span>保存＆作成
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <div id="loaderText">データを保存＆PDFを作成中...</div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQkNvNQblWXRtenGPoSaXbi99ftJ61j02s11rzCxwQZ4bDGddhzuDwrCRu0wYQxbNAow/exec"; 

    let MASTER_CLIENTS = [];
    let MASTER_CATEGORIES = [];
    let MASTER_UNITS = [];

    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('estimateDate').value = new Date().toISOString().split('T')[0];
      await loadMasterLists();
    });

    async function loadMasterLists() {
      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        
        MASTER_CLIENTS = data.clients || [];
        MASTER_CATEGORIES = data.categories || [];
        MASTER_UNITS = data.units || [];
      } catch (e) {
        console.error("マスタデータ取得失敗", e);
      } finally {
        renderClientSelect();
        for(let i=0; i<2; i++) addTableRow();
      }
    }

    function renderClientSelect() {
      const select = document.getElementById('clientSelect');
      let html = '<option value="">-- 取引先を選択 --</option>';
      MASTER_CLIENTS.forEach(client => {
        html += `<option value="${htmlEscape(client)}">${htmlEscape(client)}</option>`;
      });
      html += '<option value="__NEW__">＋新規取引先を手入力</option>';
      select.innerHTML = html;
    }

    function toggleNewClient() {
      const select = document.getElementById('clientSelect');
      const container = document.getElementById('newClientContainer');
      const input = document.getElementById('clientName');
      if(select.value === '__NEW__') {
        container.style.display = 'block';
        input.required = true;
        input.focus();
      } else {
        container.style.display = 'none';
        input.required = false;
        input.value = '';
      }
    }

    function toggleNewCategory(select) {
      const container = select.parentNode.querySelector('.dynamic-input-container');
      const input = select.parentNode.querySelector('.item-category-input');
      if(select.value === '__NEW__') {
        container.style.display = 'block';
        input.required = true;
        input.focus();
      } else {
        container.style.display = 'none';
        input.required = false;
        input.value = '';
      }
    }

    // 音声入力関数
    function startVoiceInput(button) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        Swal.fire({
          icon: 'warning',
          title: '非対応',
          text: 'お使いのブラウザは音声入力に対応していません。',
          confirmButtonText: '了解'
        });
        return;
      }
     
      const input = button.closest('.form-group').querySelector('.item-name');
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = false;
      recognition.interimResults = true;
     
      button.classList.add('recording');
      button.innerHTML = '<span class="material-symbols-outlined" style="animation: blink 1s infinite;">mic</span> 聴取中...';
      button.disabled = true;
      input.style.backgroundColor = '#FFF3E0';
      input.style.borderColor = '#FF9800';
     
      recognition.onstart = () => {
        // 入力中のビジュアル変更
      };
     
      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            transcript += event.results[i][0].transcript;
          }
        }
        if (transcript) {
          input.value = (input.value + transcript).trim();
          calculateAmount(input);
        }
      };
     
      recognition.onerror = (event) => {
        button.classList.remove('recording');
        input.style.backgroundColor = '';
        input.style.borderColor = '';
        Swal.fire({
          icon: 'error',
          title: '音声認識失敗',
          text: 'もう一度お試しください。',
          confirmButtonText: '了解'
        });
      };
     
      recognition.onend = () => {
        button.classList.remove('recording');
        button.innerHTML = '<span class="material-symbols-outlined">mic</span>';
        button.disabled = false;
        input.style.backgroundColor = '';
        input.style.borderColor = '';
      };
     
      recognition.start();
    }

    function addTableRow() {
      const container = document.getElementById('detailsContainer');
      const card = document.createElement('div');
      card.className = 'detail-card';
      
      let categoryOptions = '<option value="">-- 選択 --</option>';
      MASTER_CATEGORIES.forEach(cat => {
        categoryOptions += `<option value="${htmlEscape(cat)}">${htmlEscape(cat)}</option>`;
      });
      categoryOptions += '<option value="__NEW__">＋新規項目</option>';
      
      let unitOptions = '<option value="式">式</option>';
      MASTER_UNITS.forEach(unit => {
        if (unit && unit !== '') {
          unitOptions += `<option value="${htmlEscape(unit)}">${htmlEscape(unit)}</option>`;
        }
      });
      
      card.innerHTML = `
        <div class="card-row-upper">
          <div class="form-group">
            <label>項目</label>
            <select class="item-category-select" onchange="toggleNewCategory(this)">
              ${categoryOptions}
            </select>
            <div class="dynamic-input-container" style="display:none;">
              <input type="text" class="item-category-input" placeholder="新規項目名">
            </div>
          </div>
          <div class="form-group">
            <label>仕様・摘要 *</label>
            <div class="voice-input-wrapper">
              <input type="text" class="item-name" placeholder="品名・内容など">
              <button type="button" class="btn btn-sm" onclick="startVoiceInput(this)">
                <span class="material-symbols-outlined">mic</span>
              </button>
            </div>
          </div>
          <div class="form-group field-delete">
            <label>&nbsp;</label>
            <button type="button" class="btn btn-danger" onclick="deleteTableRow(this)">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </div>
        
        <div class="card-row-lower">
          <div class="form-group">
            <label>数量</label>
            <input type="number" class="item-qty" min="0" step="any" value="0" oninput="calculateAmount(this)">
          </div>
          <div class="form-group">
            <label>単位</label>
            <select class="item-unit">
              ${unitOptions}
            </select>
          </div>
          <div class="form-group">
            <label>単価</label>
            <input type="number" class="item-price" min="0" value="0" oninput="calculateAmount(this)">
          </div>
          <div class="form-group">
            <label>金額</label>
            <div class="amount-display-box">¥<span class="item-amount">0</span></div>
          </div>
          <div class="form-group">
            <label>備考</label>
            <input type="text" class="item-remarks" placeholder="型番など">
          </div>
        </div>
      `;
      container.appendChild(card);
    }

    function deleteTableRow(button) {
      button.closest('.detail-card').remove();
      updateTotalSummary();
    }

    function calculateAmount(input) {
      const card = input.closest('.detail-card');
      const qty = parseFloat(card.querySelector('.item-qty').value) || 0;
      const price = parseFloat(card.querySelector('.item-price').value) || 0;
      
      const amount = Math.floor(qty * price); 
      card.querySelector('.item-amount').textContent = amount.toLocaleString();
      card.querySelector('.item-amount').dataset.value = amount; 
      
      updateTotalSummary();
    }

    function updateTotalSummary() {
      let subtotal = 0;
      document.querySelectorAll('.item-amount').forEach(span => {
        subtotal += parseFloat(span.dataset.value) || 0;
      });
      
      const tax = Math.floor(subtotal * 0.1);
      const total = subtotal + tax;
      
      document.getElementById('subtotalLabel').textContent = subtotal.toLocaleString();
      document.getElementById('taxLabel').textContent = tax.toLocaleString();
      document.getElementById('totalLabel').textContent = total.toLocaleString();
      document.getElementById('totalLabel').dataset.value = total;
    }

    document.getElementById('estimateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
    });

    async function showPDFPreview() {
      const data = getFormData();
      
      if(!data.clientName) {
        Swal.fire({ icon: 'warning', title: '入力不足', text: '取引先を選択してください。', confirmButtonText: '了解' });
        return;
      }
      if(data.details.length === 0) {
        Swal.fire({ icon: 'warning', title: '入力不足', text: '明細を1件以上入力してください。', confirmButtonText: '了解' });
        return;
      }
     
      document.getElementById('loader').style.display = 'flex';
      document.getElementById('loaderText').textContent = '保留版 PDF を生成中...';
     
      try {
        // 🌟【新規】GAS呼び出し：保留版PDF生成
        const previewResponse = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({
            ...data,
            _action: 'preview'  // プレビュー用フラグ
          })
        });
        
        const previewResult = await previewResponse.json();
        
        if (previewResult.status !== 'success') {
          throw new Error(previewResult.message);
        }
     
        // HTMLプレビュー表示 + 確認ダイアログ
        showPreviewDialog(data);
     
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'プレビュー生成失敗',
          text: error.message,
          confirmButtonText: '了解'
        });
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }
     
     
    【新規：showPreviewDialog 関数】
     
    function showPreviewDialog(data) {
      let detailRows = '';
      data.details.forEach(item => {
        detailRows += `
          <tr>
            <td style="border: 1px solid #ddd; padding: 4px;">${htmlEscape(item.itemCategory)}</td>
            <td style="border: 1px solid #ddd; padding: 4px;">${htmlEscape(item.itemName)}</td>
            <td style="border: 1px solid #ddd; padding: 4px; text-align: right;">${item.itemQty}</td>
            <td style="border: 1px solid #ddd; padding: 4px;">${htmlEscape(item.itemUnit)}</td>
            <td style="border: 1px solid #ddd; padding: 4px; text-align: right;">¥${item.itemPrice.toLocaleString()}</td>
            <td style="border: 1px solid #ddd; padding: 4px; text-align: right;">¥${item.itemAmount.toLocaleString()}</td>
          </tr>
        `;
      });
     
      const previewHtml = `
        <div style="text-align: left; font-size: 12px; max-height: 500px; overflow-y: auto; background: white; padding: 16px; border-radius: 8px;">
          <h3 style="margin-bottom: 8px; border-bottom: 2px solid #1976D2; padding-bottom: 8px;">御見積書</h3>
          <p style="margin: 4px 0;"><strong>見積日:</strong> ${data.estimateDate}</p>
          <p style="margin: 4px 0;"><strong>取引先:</strong> ${htmlEscape(data.clientName)}</p>
          ${data.clientAddress ? `<p style="margin: 4px 0;"><strong>住所:</strong> ${htmlEscape(data.clientAddress)}</p>` : ''}
          <p style="margin: 4px 0;"><strong>件名:</strong> ${htmlEscape(data.subject)}</p>
          <hr style="margin: 8px 0; border: none; border-top: 1px solid #ddd;">
          <table style="width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 11px;">
            <tr style="background: #E3F2FD;">
              <th style="border: 1px solid #ddd; padding: 4px;">項目</th>
              <th style="border: 1px solid #ddd; padding: 4px;">品名</th>
              <th style="border: 1px solid #ddd; padding: 4px; text-align: right;">数量</th>
              <th style="border: 1px solid #ddd; padding: 4px;">単位</th>
              <th style="border: 1px solid #ddd; padding: 4px; text-align: right;">単価</th>
              <th style="border: 1px solid #ddd; padding: 4px; text-align: right;">金額</th>
            </tr>
            ${detailRows}
          </table>
          <hr style="margin: 8px 0; border: none; border-top: 1px solid #ddd;">
          <div style="text-align: right; margin: 8px 0;">
            <p style="margin: 4px 0;">小計: ¥${data.subtotal.toLocaleString()}</p>
            <p style="margin: 4px 0;">消費税(10%): ¥${data.tax.toLocaleString()}</p>
            <p style="font-weight: 600; font-size: 13px; margin: 4px 0;">合計: ¥${data.total.toLocaleString()}</p>
          </div>
          ${data.remarks ? `<p style="margin: 8px 0;"><strong>備考:</strong> ${htmlEscape(data.remarks).replace(/\n/g, '<br>')}</p>` : ''}
        </div>
      `;
     
      Swal.fire({
        title: 'PDFプレビュー',
        html: previewHtml,
        showDenyButton: true,
        showCancelButton: true,
        confirmButtonText: '確定して保存',
        denyButtonText: 'ドラフト保存',
        cancelButtonText: 'キャンセル',
        confirmButtonColor: '#1976D2',
        denyButtonColor: '#FF9800'
      }).then((result) => {
        if (result.isConfirmed) {
          // 確定版で保存
          submitEstimate(data, 'confirmed');
        } else if (result.isDenied) {
          // ドラフト版で保存
          submitEstimate(data, 'draft');
        } else if (result.dismiss === Swal.DismissReason.cancel) {
          // キャンセル：保留版PDFは Google Drive に残す
          Swal.fire({
            icon: 'info',
            title: 'キャンセルしました',
            text: '保留版PDFはGoogle Driveに残っています。',
            confirmButtonText: '了解'
          });
        }
      });
    }
     
     
    【新規：submitEstimate 関数】
     
    async function submitEstimate(data, status) {
      const payload = {
        clientName: data.clientName,
        clientAddress: data.clientAddress,
        estimateDate: data.estimateDate,
        subject: data.subject,
        paymentTerms: data.paymentTerms,
        validity: data.validity,
        remarks: data.remarks,
        totalAmount: data.total,
        details: data.details,
        status: status === 'confirmed' ? '確定' : 'ドラフト'
      };
     
      document.getElementById('loader').style.display = 'flex';
      document.getElementById('loaderText').textContent = '保存中...';
     
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
          document.getElementById('numberPlaceholder').textContent = result.estimateNo;
          
          const message = status === 'confirmed' 
            ? `見積番号: <strong>${result.estimateNo}</strong><br>確定版PDFを生成しました。`
            : `見積番号: <strong>${result.estimateNo}</strong><br>ドラフト版として保存しました。`;
          
          Swal.fire({
            icon: 'success',
            title: '保存完了！',
            html: message,
            confirmButtonText: '閉じる'
          });
          
          document.getElementById('estimateForm').reset();
          document.getElementById('detailsContainer').innerHTML = '';
          for(let i=0; i<2; i++) addTableRow();
        } else {
          Swal.fire({ icon: 'error', title: 'エラー', text: result.message });
        }
      } catch (error) {
        Swal.fire({ icon: 'error', title: '通信エラー', text: error.message });
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }




    

    function htmlEscape(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
