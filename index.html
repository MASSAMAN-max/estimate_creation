<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡易見積書作成システム</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --text: #334155;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 8px;
    }
    /* フォームグリッド */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full-width {
      grid-column: span 2;
    }
    label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    input, select, textarea {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }
    /* 明細テーブル */
    .table-container {
      margin-bottom: 24px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f1f5f9;
      font-size: 14px;
    }
    .col-action { width: 60px; text-align: center; }
    .col-num { width: 100px; }
    .col-amount { width: 120px; text-align: right; }
    
    .btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background-color: var(--primary); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #64748b; color: white; margin-bottom: 12px; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-danger { background-color: #ef4444; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-danger:hover { background-color: #dc2626; }
    
    /* 計算結果エリア */
    .summary-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 30px;
      font-size: 15px;
    }
    .summary-row {
      display: flex;
      width: 250px;
      justify-content: space-between;
    }
    .summary-row.total {
      font-size: 18px;
      font-weight: bold;
      border-top: 1px solid var(--text);
      padding-top: 8px;
      color: var(--primary);
    }
    
    /* ローダー */
    .loader-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader" class="loader-overlay" style="display: none;">
    <div class="loader"></div>
  </div>

  <div class="container">
    <h1>見積書 新規作成</h1>
    
    <form id="estimateForm">
      <div class="form-grid">
        <div class="form-group">
          <label>発注元会社名 *</label>
          <input type="text" id="clientName" required placeholder="〇〇株式会社 御中">
        </div>
        <div class="form-group">
          <label>見積日 *</label>
          <input type="date" id="estimateDate" required>
        </div>
        <div class="form-group full-width">
          <label>件名 *</label>
          <input type="text" id="subject" required placeholder="新築工事に伴うお見積り">
        </div>
        <div class="form-group">
          <label>お支払条件</label>
          <input type="text" id="paymentTerms" placeholder="自社締翌月末現金払い 等">
        </div>
        <div class="form-group">
          <label>有効期限</label>
          <input type="text" id="validity" placeholder="見積後1ヶ月 間">
        </div>
      </div>

      <h3>見積明細</h3>
      <button type="button" class="btn btn-secondary" onclick="addTableRow()">＋ 行を追加</button>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="col-action">削除</th>
              <th>品名・仕様</th>
              <th class="col-num">数量</th>
              <th class="col-num">単位</th>
              <th class="col-num">単価</th>
              <th class="col-num col-amount">金額</th>
            </tr>
          </thead>
          <tbody id="detailsTableBody">
            </tbody>
        </table>
      </div>

      <div class="summary-box">
        <div class="summary-row">
          <span>小計:</span>
          <span>¥<span id="subtotalLabel">0</span></span>
        </div>
        <div class="summary-row">
          <span>消費税 (10%):</span>
          <span>¥<span id="taxLabel">0</span></span>
        </div>
        <div class="summary-row total">
          <span>合計金額:</span>
          <span>¥<span id="totalLabel">0</span></span>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label>備考</label>
        <textarea id="remarks" rows="3" placeholder="諸経費、別途工事条件などがあれば入力"></textarea>
      </div>

      <div style="text-align: right; margin-top: 20px;">
        <button type="submit" class="btn btn-primary" style="font-size: 16px; padding: 10px 24px;">この内容でGASへ保存</button>
      </div>
    </form>
  </div>

  <script>
    // 💡 2回目の回答で作成するGASの「ウェブアプリURL」をここに貼り付けます
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwN5Wbte0Iz7yq5iQMXiW0LqLBQnfd5sO4vguHxQQEhrow7u8ySJbO-7_TvBNSEnjjf-Q/exec"; 

    // 画面を開いた時の初期処理（見積日を当日に設定し、初期行を3行生成）
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('estimateDate').value = new Date().toISOString().split('T')[0];
      for(let i = 0; i < 3; i++) {
        addTableRow();
      }
    });

    // 明細行を追加する処理
    function addTableRow() {
      const tbody = document.getElementById('detailsTableBody');
      const tr = document.createElement('tr');
      
      tr.innerHTML = `
        <td class="col-action">
          <button type="button" class="btn btn-danger" onclick="deleteTableRow(this)">削除</button>
        </td>
        <td>
          <input type="text" class="item-name" style="width: 100%;" required placeholder="品名や工事内容を入力">
        </td>
        <td>
          <input type="number" class="item-qty" style="width: 100%; text-align: right;" min="0" step="any" value="0" oninput="calculateAmount(this)">
        </td>
        <td>
          <input type="text" class="item-unit" style="width: 100%; text-align: center;" placeholder="式">
        </td>
        <td>
          <input type="number" class="item-price" style="width: 100%; text-align: right;" min="0" value="0" oninput="calculateAmount(this)">
        </td>
        <td class="col-amount">
          ¥<span class="item-amount">0</span>
        </td>
      `;
      tbody.appendChild(tr);
    }

    // 明細行を削除する処理
    function deleteTableRow(button) {
      const row = button.closest('tr');
      row.remove();
      updateTotalSummary();
    }

    // 各明細行ごとの金額計算（数量 × 単価）
    function calculateAmount(input) {
      const row = input.closest('tr');
      const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
      const price = parseFloat(row.querySelector('.item-price').value) || 0;
      
      const amount = Math.floor(qty * price); // 端数は切り捨て
      row.querySelector('.item-amount').textContent = amount.toLocaleString();
      row.querySelector('.item-amount').dataset.value = amount; // 計算用の生の数値をデータ属性に保持
      
      updateTotalSummary();
    }

    // 全体の小計・消費税・合計を更新する処理
    function updateTotalSummary() {
      let subtotal = 0;
      document.querySelectorAll('.item-amount').forEach(span => {
        subtotal += parseFloat(span.dataset.value) || 0;
      });
      
      const tax = Math.floor(subtotal * 0.1);
      const total = subtotal + tax;
      
      document.getElementById('subtotalLabel').textContent = subtotal.toLocaleString();
      document.getElementById('taxLabel').textContent = tax.toLocaleString();
      document.getElementById('totalLabel').textContent = total.toLocaleString();
      
      // 送信時に利用するため、生の合計数値を保持
      document.getElementById('totalLabel').dataset.value = total;
    }

    // フォーム送信処理（GASのメイン・明細分離型APIへデータを転送）
    document.getElementById('estimateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if(GAS_WEB_APP_URL === "YOUR_GAS_WEB_APP_URL") {
        alert("GASのウェブアプリURLが設定されていません。2回目の手順を完了させてURLを差し替えてください。");
        return;
      }
      
      // 1. 各明細行のデータを配列として収集
      const details = [];
      document.querySelectorAll('#detailsTableBody tr').forEach(row => {
        const name = row.querySelector('.item-name').value.trim();
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const unit = row.querySelector('.item-unit').value.trim() || '式';
        
        if(name !== "") {
          details.push({
            itemName: name,
            itemQty: qty,
            itemUnit: unit,
            itemPrice: price,
            itemAmount: Math.floor(qty * price)
          });
        }
      });

      if(details.length === 0) {
        alert("明細を1件以上入力してください。");
        return;
      }

      // 💡 2. メイン情報と明細情報を綺麗に分けたペイロードの組み立て
      const payload = {
        // メイン情報（親データ）
        clientName: document.getElementById('clientName').value.trim(),
        estimateDate: document.getElementById('estimateDate').value,
        subject: document.getElementById('subject').value.trim(),
        paymentTerms: document.getElementById('paymentTerms').value.trim(),
        validity: document.getElementById('validity').value.trim(),
        remarks: document.getElementById('remarks').value.trim(),
        totalAmount: parseInt(document.getElementById('totalLabel').dataset.value) || 0,
        // 明細情報（子データ）
        details: details
      };

      // 画面にローダーを表示
      document.getElementById('loader').style.display = 'flex';

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
          alert(`見積書を保存しました！\n見積番号: ${result.estimateNo}`);
          
          // フォームのリセットと初期化
          document.getElementById('estimateForm').reset();
          document.getElementById('detailsTableBody').innerHTML = '';
          for(let i = 0; i < 3; i++) {
            addTableRow();
          }
          updateTotalSummary();
        } else {
          alert('エラーが発生しました: ' + result.message);
        }
      } catch (error) {
        alert('通信エラーが発生しました: ' + error.message);
      } finally {
        // ローダーを非表示にする
        document.getElementById('loader').style.display = 'none';
      }
    });
  </script>
</body>
</html>
